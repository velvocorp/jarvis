<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>JARVIS</title>

<!-- PWA / installazione come app su iPhone -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --blue: #00d9ff;
    --blue-dim: #0088aa;
    --bg: #000000;
    --state-color: #00d9ff; /* cambia in base allo stato: idle/ascolto/elaborazione/parla */
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    width:100%; height:100%;
    background: radial-gradient(circle at 50% 40%, #001015 0%, #000000 70%);
    color: var(--blue);
    font-family: 'Courier New', monospace;
    overflow:hidden;
    -webkit-user-select:none; user-select:none;
  }
  #app{
    position:relative;
    width:100%; height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }

  /* Scanlines / vignette overlay */
  #overlay{
    position:fixed; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,217,255,0.03) 0px, rgba(0,217,255,0.03) 1px, transparent 1px, transparent 3px);
    z-index:50;
  }

  /* ---- Central circle ---- */
  #core-wrap{
    position:relative;
    width:min(60vw, 320px);
    height:min(60vw, 320px);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring{
    position:absolute;
    border-radius:50%;
    border:1px solid var(--blue-dim);
    opacity:0.6;
  }
  .ring1{ inset:0; border-width:1px; animation: spin 14s linear infinite; border-color: color-mix(in srgb, var(--state-color) 70%, transparent); }
  .ring2{ inset:10%; border-style:dashed; opacity:0.35; animation: spin 22s linear infinite reverse; border-color: color-mix(in srgb, var(--state-color) 70%, transparent); }
  .ring3{ inset:20%; opacity:0.5; animation: pulse 2.5s ease-in-out infinite; border-color: color-mix(in srgb, var(--state-color) 70%, transparent); }

  /* anello segmentato esterno che ruota - stile "mirino" HUD */
  #seg-ring{
    position:absolute; inset:-10%;
    width:120%; height:120%;
    animation: spin 8s linear infinite;
  }

  #core{
    position:relative;
    width:55%; height:55%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--state-color) 35%, transparent), color-mix(in srgb, var(--state-color) 5%, transparent) 60%, transparent 75%);
    box-shadow: 0 0 40px 6px color-mix(in srgb, var(--state-color) 35%, transparent), inset 0 0 30px color-mix(in srgb, var(--state-color) 40%, transparent);
    display:flex; align-items:center; justify-content:center;
    animation: coreBreathe 3s ease-in-out infinite;
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  #core-label{
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: 4px;
    font-weight:bold;
    color:#eafcff;
    text-shadow: 0 0 12px var(--state-color), 0 0 24px var(--state-color);
    transition: text-shadow 0.4s ease;
  }
  #status-label{
    position:absolute;
    bottom:-34px;
    font-size:11px;
    letter-spacing:3px;
    color: var(--state-color);
    text-transform:uppercase;
    transition: color 0.4s ease;
  }

  @keyframes spin{ from{transform:rotate(0)} to{transform:rotate(360deg)} }
  @keyframes pulse{ 0%,100%{opacity:0.3; transform:scale(1);} 50%{opacity:0.7; transform:scale(1.04);} }
  @keyframes coreBreathe{ 0%,100%{ opacity: 0.9; } 50%{ opacity: 1; } }

  /* ---- Equalizzatore vocale (visibile mentre ascolta/parla) ---- */
  #eq{
    position:absolute;
    bottom:-58px;
    display:flex; align-items:flex-end; gap:3px;
    height:16px;
    opacity:0;
    transition: opacity 0.3s ease;
  }
  #eq.active{ opacity:1; }
  #eq span{
    width:3px; background: var(--state-color);
    border-radius:2px;
    animation: eqBounce 0.9s ease-in-out infinite;
  }
  #eq span:nth-child(1){ animation-delay: 0s; }
  #eq span:nth-child(2){ animation-delay: 0.12s; }
  #eq span:nth-child(3){ animation-delay: 0.24s; }
  #eq span:nth-child(4){ animation-delay: 0.36s; }
  #eq span:nth-child(5){ animation-delay: 0.48s; }
  @keyframes eqBounce{
    0%,100%{ height:4px; }
    50%{ height:16px; }
  }

  /* ---- Cornici angolari stile HUD/mirino ---- */
  .hud-corner{
    position:fixed; width:26px; height:26px;
    border-color: var(--blue-dim);
    opacity:0.55;
    z-index:40;
    pointer-events:none;
  }
  .hud-corner.tl{ top:14px; left:14px; border-top:2px solid; border-left:2px solid; }
  .hud-corner.tr{ top:14px; right:14px; border-top:2px solid; border-right:2px solid; }
  .hud-corner.bl{ bottom:14px; left:14px; border-bottom:2px solid; border-left:2px solid; }
  .hud-corner.br{ bottom:14px; right:14px; border-bottom:2px solid; border-right:2px solid; }

  /* ---- Bottom-left: live position ---- */
  #geo-box{
    position:fixed;
    bottom:24px; left:20px;
    font-size:11px;
    line-height:1.5;
    color: var(--blue);
    opacity:0.85;
    max-width:200px;
  }
  #geo-box .tag{ color:var(--blue-dim); letter-spacing:2px; font-size:10px;}

  /* ---- Bottom-center: clock ---- */
  #clock-box{
    position:fixed;
    bottom:24px; left:50%; transform:translateX(-50%);
    text-align:center;
  }
  #clock-time{
    font-size:22px; letter-spacing:2px;
    text-shadow: 0 0 10px var(--blue);
  }
  #clock-date{
    font-size:10px; letter-spacing:2px; color:var(--blue-dim); margin-top:2px;
  }

  /* ---- Right side: mic / mode ---- */
  #mic-btn{
    position:fixed;
    bottom:22px; right:20px;
    width:56px; height:56px;
    border-radius:50%;
    border:1px solid var(--blue);
    background: rgba(0,217,255,0.08);
    color: var(--blue);
    font-size:22px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  #mic-btn.listening{
    animation: pulse 1s ease-in-out infinite;
    background: rgba(0,217,255,0.25);
  }

  /* ---- Conversation feed under the circle ---- */
  #feed{
    position:fixed;
    top: calc(50% + min(30vw,160px) + 60px);
    left:50%; transform:translateX(-50%);
    width:min(92vw, 480px);
    max-height:28vh;
    overflow-y:auto;
    font-size:12.5px;
    line-height:1.5;
    text-align:center;
    padding: 0 10px;
  }
  #feed .line{ margin-bottom:8px; opacity:0.9; }
  #feed .jarvis{ color: var(--blue); }
  #feed .user{ color: #8fe9ff; opacity:0.7; }
  #feed .system{ color: #ffb400; font-size:11px; }

  /* ---- Settings ---- */
  #gear{
    position:fixed; top:16px; right:16px;
    color:var(--blue-dim); font-size:18px; cursor:pointer; z-index:60;
  }
  #settings{
    position:fixed; inset:0; background:rgba(0,0,0,0.92);
    display:none; align-items:center; justify-content:center; z-index:70;
    flex-direction:column; gap:14px; padding:20px;
  }
  #settings.open{display:flex;}
  #settings input{
    width:min(90vw,340px); padding:10px; background:#001217; border:1px solid var(--blue-dim);
    color:var(--blue); font-family:monospace; font-size:13px; border-radius:4px;
  }
  #settings button, #close-settings{
    padding:10px 20px; background:transparent; border:1px solid var(--blue);
    color:var(--blue); font-family:monospace; letter-spacing:2px; cursor:pointer; border-radius:4px;
  }
  #settings label{ font-size:11px; letter-spacing:2px; color:var(--blue-dim); align-self:flex-start; margin-left:calc(50% - 170px);}

  #top-left-title{
    position:fixed; top:16px; left:20px;
    font-size:11px; letter-spacing:3px; color:var(--blue-dim);
  }

  /* ---- Lock screen ---- */
  #lock-screen{
    position:fixed; inset:0; z-index:200;
    background: radial-gradient(circle at 50% 40%, #001015 0%, #000000 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; padding:20px;
  }
  #lock-ring{
    width:90px; height:90px; border-radius:50%;
    border:2px solid var(--blue);
    box-shadow: 0 0 30px 4px rgba(0,217,255,0.4), inset 0 0 20px rgba(0,217,255,0.3);
    animation: pulse 2.2s ease-in-out infinite;
  }
  #lock-title{
    font-size:20px; letter-spacing:6px; color:#eafcff;
    text-shadow: 0 0 12px var(--blue);
  }
  #lock-subtitle{
    font-size:11px; letter-spacing:2px; color:var(--blue-dim);
  }
  #lock-input{
    width:min(80vw, 260px); padding:12px; text-align:center;
    background:#001217; border:1px solid var(--blue-dim);
    color:var(--blue); font-family:monospace; font-size:16px;
    letter-spacing:4px; border-radius:6px;
  }
  #lock-btn{
    padding:10px 28px; background:transparent; border:1px solid var(--blue);
    color:var(--blue); font-family:monospace; letter-spacing:3px; cursor:pointer;
    border-radius:4px; font-size:12px;
  }
  #lock-error{
    font-size:11px; color:#ff5566; letter-spacing:1px; min-height:14px;
  }
  #main-content{ display:none; }
</style>
</head>
<body>
<div id="overlay"></div>

<!-- ===== SCHERMATA DI BLOCCO CON PASSWORD ===== -->
<div id="lock-screen">
  <div id="lock-ring"></div>
  <div id="lock-title">J A R V I S</div>
  <div id="lock-subtitle" id="lockSubtitle">Inserisci la password</div>
  <input type="password" id="lock-input" autocomplete="off" placeholder="••••••">
  <button id="lock-btn" onclick="tryUnlock()">SBLOCCA</button>
  <div id="lock-error"></div>
</div>
<div id="main-content">
<div id="top-left-title">V E L V O &nbsp;// &nbsp;J.A.R.V.I.S.</div>

<div class="hud-corner tl"></div>
<div class="hud-corner tr"></div>
<div class="hud-corner bl"></div>
<div class="hud-corner br"></div>

<div id="app">
  <div id="core-wrap">
    <svg id="seg-ring" viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="94" fill="none" stroke="var(--state-color)" stroke-width="2"
        stroke-dasharray="10 14" opacity="0.55"/>
    </svg>
    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>
    <div id="core">
      <div id="core-label">JARVIS</div>
    </div>
    <div id="status-label">In attesa</div>
    <div id="eq"><span></span><span></span><span></span><span></span><span></span></div>
  </div>
</div>

<div id="feed"></div>

<div id="geo-box">
  <div class="tag">POSIZIONE</div>
  <div id="geo-text">rilevamento...</div>
</div>

<div id="clock-box">
  <div id="clock-time">--:--:--</div>
  <div id="clock-date">-- --- ----</div>
</div>

<div id="mic-btn" onclick="toggleListen()" title="Attiva/disattiva ascolto continuo">🎙</div>

</div><!-- /#main-content -->

<script>
/* ================== ACCESSO CON PASSWORD ================== */
const PWD_KEY = 'jarvis_pwd_hash';
const UNLOCK_SESSION_KEY = 'jarvis_unlocked';

function simpleHash(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i))|0; }
  return h.toString(36);
}

function initLock(){
  const stored = localStorage.getItem(PWD_KEY);
  const input = document.getElementById('lock-input');
  const sub = document.getElementById('lock-subtitle');

  // gia' sbloccato in questa sessione del browser
  if(sessionStorage.getItem(UNLOCK_SESSION_KEY) === '1'){
    showMain();
    return;
  }

  if(!stored){
    sub.textContent = 'Imposta la tua password personale';
  }
  input.addEventListener('keydown', (e) => { if(e.key === 'Enter') tryUnlock(); });
  input.focus();
}

function tryUnlock(){
  const stored = localStorage.getItem(PWD_KEY);
  const input = document.getElementById('lock-input');
  const err = document.getElementById('lock-error');
  const val = input.value;

  if(!val){ err.textContent = 'Inserisci una password.'; return; }

  if(!stored){
    // prima configurazione: questa diventa la password
    localStorage.setItem(PWD_KEY, simpleHash(val));
    sessionStorage.setItem(UNLOCK_SESSION_KEY, '1');
    showMain();
    return;
  }

  if(simpleHash(val) === stored){
    sessionStorage.setItem(UNLOCK_SESSION_KEY, '1');
    showMain();
  } else {
    err.textContent = 'Password errata.';
    input.value = '';
  }
}

function showMain(){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('main-content').style.display = 'block';
}

initLock();

/* ================== CONFIG / MEMORY ================== */
const MEM_KEY = 'jarvis_hud_memory';

function loadMemory(){
  try{ return JSON.parse(localStorage.getItem(MEM_KEY) || '[]'); }catch(e){ return []; }
}
function saveMemory(list){ localStorage.setItem(MEM_KEY, JSON.stringify(list)); }

/* ================== CLOCK ================== */
function tickClock(){
  const now = new Date();
  const opts = { timeZone: 'Europe/Rome' };
  const time = now.toLocaleTimeString('it-IT', {...opts, hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const date = now.toLocaleDateString('it-IT', {...opts, weekday:'short', day:'2-digit', month:'short', year:'numeric'});
  document.getElementById('clock-time').textContent = time;
  document.getElementById('clock-date').textContent = date.toUpperCase();
}
setInterval(tickClock, 1000);
tickClock();

/* ================== GEO ================== */
function updateGeo(){
  const box = document.getElementById('geo-text');
  if(!navigator.geolocation){
    box.textContent = 'non disponibile';
    return;
  }
  navigator.geolocation.watchPosition(
    (pos) => {
      const lat = pos.coords.latitude.toFixed(4);
      const lon = pos.coords.longitude.toFixed(4);
      box.innerHTML = `LAT ${lat}<br>LON ${lon}`;
    },
    (err) => { box.textContent = 'accesso negato'; },
    { enableHighAccuracy:true, maximumAge:5000 }
  );
}
updateGeo();

/* ================== FEED ================== */
function addLine(type, text){
  const feed = document.getElementById('feed');
  const div = document.createElement('div');
  div.className = 'line ' + type;
  const prefix = type==='jarvis' ? 'JARVIS: ' : type==='user' ? 'TU: ' : '';
  div.textContent = prefix + text;
  feed.appendChild(div);
  feed.scrollTop = feed.scrollHeight;
  while(feed.children.length > 12){ feed.removeChild(feed.firstChild); }
}

function setStatus(s){
  document.getElementById('status-label').textContent = s;

  // colore di stato + equalizzatore: cosi' si capisce a colpo d'occhio
  // cosa sta facendo Jarvis, non solo leggendo il testo
  const root = document.documentElement.style;
  const eq = document.getElementById('eq');
  if(s === 'In ascolto'){
    root.setProperty('--state-color', '#00ff9d');
    eq.classList.add('active');
  } else if(s === 'Elaboro'){
    root.setProperty('--state-color', '#ffb400');
    eq.classList.remove('active');
  } else if(s === 'Sto parlando'){
    root.setProperty('--state-color', '#eafcff');
    eq.classList.add('active');
  } else {
    root.setProperty('--state-color', '#00d9ff');
    eq.classList.remove('active');
  }
}

/* ================== SPEECH: STT ================== */
let recognition = null;
let listening = false;      // is recognition actively capturing right now
let continuousMode = false; // hands-free mode: auto-restart after every phrase
let speakingNow = false;    // true while JARVIS is talking (mic paused)
let restartTimer = null;
let silenceTimer = null;
let finalTranscript = '';

function initRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ addLine('system', 'Riconoscimento vocale non supportato su questo browser.'); return null; }
  const r = new SR();
  r.lang = 'it-IT';
  // interim results + silenzio gestito a mano: cosi' non taglia la frase
  // troppo presto (il rilevamento automatico del browser e' pensato per
  // il microfono di uno smartphone e su desktop e' molto piu' aggressivo)
  r.continuous = true;
  r.interimResults = true;

  r.onresult = (e) => {
    let interim = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const chunk = e.results[i][0].transcript;
      if(e.results[i].isFinal){
        finalTranscript += chunk + ' ';
      } else {
        interim += chunk;
      }
    }
    // ogni volta che sente qualcosa (anche parziale) resetta il timer
    // di silenzio: la frase si considera finita solo dopo una pausa vera
    clearTimeout(silenceTimer);
    silenceTimer = setTimeout(() => finalizeSpeech(), 1400);
  };
  r.onerror = (e) => {
    listening = false;
    scheduleRestart();
  };
  r.onend = () => {
    listening = false;
    finalizeSpeech();
    scheduleRestart();
  };
  return r;
}

function finalizeSpeech(){
  clearTimeout(silenceTimer);
  const text = finalTranscript.trim();
  finalTranscript = '';
  if(text){
    addLine('user', text);
    handleCommand(text);
  }
}

function scheduleRestart(){
  if(!continuousMode || speakingNow) {
    document.getElementById('mic-btn').classList.remove('listening');
    if(!speakingNow) setStatus('In attesa');
    return;
  }
  clearTimeout(restartTimer);
  restartTimer = setTimeout(() => {
    if(continuousMode && !speakingNow && !listening) startRecognition();
  }, 350);
}

function startRecognition(){
  if(!recognition) recognition = initRecognition();
  if(!recognition) return;
  finalTranscript = '';
  try{
    recognition.start();
    listening = true;
    document.getElementById('mic-btn').classList.add('listening');
    setStatus('In ascolto');
  }catch(e){ /* already started, ignore */ }
}

function toggleListen(){
  // iOS/Safari audio unlock - needs a real tap the first time
  unlockAudio();
  continuousMode = !continuousMode;
  if(continuousMode){
    addLine('system', 'Ascolto continuo attivato: puoi parlarmi liberamente, senza toccare nulla.');
    startRecognition();
  } else {
    addLine('system', 'Ascolto continuo disattivato.');
    if(recognition) recognition.stop();
    document.getElementById('mic-btn').classList.remove('listening');
    setStatus('In attesa');
  }
}

/* ================== SPEECH: TTS ================== */
let audioUnlocked = false;
let voicesReady = false;
let cachedItVoice = null;

function loadVoices(){
  const voices = window.speechSynthesis.getVoices();
  if(voices.length){
    cachedItVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('it')) || null;
    voicesReady = true;
  }
}
window.speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function unlockAudio(){
  if(audioUnlocked) return;
  const u = new SpeechSynthesisUtterance('');
  window.speechSynthesis.speak(u);
  audioUnlocked = true;
}

// Bug noto di Chrome desktop: dopo qualche secondo di inattivita' la
// sintesi vocale puo' "addormentarsi" e non emettere piu' audio pur
// restando in stato "speaking". Questo tenerla sveglia risolve il problema.
setInterval(() => {
  if(window.speechSynthesis.speaking){
    window.speechSynthesis.pause();
    window.speechSynthesis.resume();
  }
}, 4000);

function speak(text){
  // pause mic while JARVIS talks, so it doesn't hear itself
  speakingNow = true;
  if(recognition && listening){ try{ recognition.stop(); }catch(e){} }

  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'it-IT';
  u.rate = 1.0;
  u.pitch = 0.9;
  u.volume = 1.0;
  if(cachedItVoice) u.voice = cachedItVoice;
  setStatus('Sto parlando');
  u.onend = () => {
    speakingNow = false;
    setStatus('In attesa');
    if(continuousMode) startRecognition();
  };
  window.speechSynthesis.speak(u);
}

/* ================== COMMAND HANDLING ================== */
// pending confirmation state
let pending = null; // { type:'remember', content:'...' }

async function handleCommand(text){
  const lower = text.toLowerCase().trim();

  // handle yes/no confirmation for a pending action
  if(pending){
    if(/^(s[iì]|si|esatto|confermo|giusto|ok|va bene)/.test(lower)){
      finalizePending();
      return;
    }
    if(/^(no|non è cos[iì]|sbagliato|annulla)/.test(lower)){
      addLine('jarvis', 'Va bene, annullato.');
      speak('Va bene, annullato.');
      pending = null;
      return;
    }
    // if unclear, fall through and re-ask
  }

  // explicit "ricorda/ricordami" trigger
  const rememberMatch = lower.match(/^(ricorda(mi)?|memorizza|segna(ti)?)\s+(che\s+|di\s+)?(.+)/);
  if(rememberMatch){
    const content = rememberMatch[5];
    pending = { type:'remember', content };
    const q = `Vuoi che ricordi: "${content}"? Confermi?`;
    addLine('jarvis', q);
    speak(q);
    return;
  }

  // "cosa ricordi" / list memory
  if(/cosa (ti )?ricordi|elenca (i )?ricordi|mostra (i )?ricordi/.test(lower)){
    const mem = loadMemory();
    if(mem.length===0){
      const r = 'Non ho ancora nulla salvato in memoria.';
      addLine('jarvis', r); speak(r);
    } else {
      const list = mem.map(m=>m.content).join('; ');
      addLine('jarvis', 'Ecco cosa ricordo: ' + list);
      speak('Ecco cosa ricordo: ' + list);
    }
    return;
  }

  // default: send to Groq LLM (tramite server) con memoria come contesto
  setStatus('Elaboro');
  try{
    const reply = await askGroq(text);
    addLine('jarvis', reply);
    speak(reply);
  }catch(e){
    const r = 'Ho avuto un problema a contattare il server. Riprova.';
    addLine('jarvis', r); speak(r);
  }
}

function finalizePending(){
  if(!pending) return;
  if(pending.type === 'remember'){
    const mem = loadMemory();
    mem.push({ content: pending.content, date: new Date().toISOString() });
    saveMemory(mem);
    const r = 'Fatto, l\'ho salvato in memoria.';
    addLine('jarvis', r);
    speak(r);
  }
  pending = null;
}

/* ================== GROQ CALL (tramite funzione server /api/chat) ================== */
async function askGroq(userText){
  const mem = loadMemory();
  const memText = mem.length
    ? 'Cose che l\'utente ti ha chiesto di ricordare: ' + mem.map(m=>m.content).join('; ')
    : 'Non hai ancora nessun ricordo salvato.';

  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: userText, memoryText: memText })
  });
  if(!res.ok) throw new Error('API error');
  const data = await res.json();
  return data.reply;
}
